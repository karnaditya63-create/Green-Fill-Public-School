{
 "name": "Build Android APK",
 "on": {
  "workflow_dispatch": {}
 },
 "jobs": {
  "build": {
   "runs-on": "ubuntu-latest",
   "steps": [
    {
     "name": "Get the repository files",
     "uses": "actions/checkout@v4"
    },
    {
     "name": "Set up Node",
     "uses": "actions/setup-node@v4",
     "with": {
      "node-version": 20
     }
    },
    {
     "name": "Set up Java",
     "uses": "actions/setup-java@v4",
     "with": {
      "distribution": "temurin",
      "java-version": 17
     }
    },
    {
     "name": "Put the website files in the app folder",
     "run": "mkdir -p www\ncp index.html www/\ncp manifest.json www/ || true\ncp service-worker.js www/ || true\ncp icon-*.png www/ || true\n"
    },
    {
     "name": "Install Capacitor",
     "run": "npm init -y\nnpm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/assets@3\n"
    },
    {
     "name": "Create the Android project",
     "run": "npx cap init \"Green Fill Public School\" com.greenfill.school --web-dir www\nnpx cap add android\n"
    },
    {
     "name": "Put the school logo in as the app icon",
     "run": "npm install sharp\ncat > make-icons.js <<'ICONEOF'\nconst sharp = require('sharp');\nconst fs = require('fs');\nconst sizes = { mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192 };\n(async () => {\n  for (const d of Object.keys(sizes)) {\n    const s = sizes[d];\n    const dir = 'android/app/src/main/res/mipmap-' + d;\n    fs.mkdirSync(dir, { recursive: true });\n    await sharp('icon-512.png').resize(s, s).png().toFile(dir + '/ic_launcher.png');\n    const mask = Buffer.from('<svg width=\"' + s + '\" height=\"' + s + '\"><circle cx=\"' + (s/2) + '\" cy=\"' + (s/2) + '\" r=\"' + (s/2) + '\"/></svg>');\n    await sharp('icon-512.png').resize(s, s).composite([{ input: mask, blend: 'dest-in' }]).png().toFile(dir + '/ic_launcher_round.png');\n    console.log('icons written for ' + d);\n  }\n})().catch(function (e) { console.error(e); process.exit(1); });\nICONEOF\nnode make-icons.js\nrm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml\nls -la android/app/src/main/res/mipmap-xxxhdpi"
    },
    {
     "name": "Copy the website into the app",
     "run": "npx cap sync android"
    },
    {
     "name": "Build the APK",
     "working-directory": "android",
     "run": "chmod +x gradlew\n./gradlew assembleDebug\n"
    },
    {
     "name": "Save the APK so you can download it",
     "uses": "actions/upload-artifact@v4",
     "with": {
      "name": "Green-Fill-School-APK",
      "path": "android/app/build/outputs/apk/debug/app-debug.apk"
     }
    }
   ]
  }
 }
}
